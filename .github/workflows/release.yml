# Publishes a GitHub release when a version tag (v1.2.0) is pushed. The tag is
# made by `pnpm release`, which has already moved the changelog's "Unreleased"
# notes under the version; this only checks, builds and publishes.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Nothing by default; the job below asks for what it needs.
permissions: {}

# Actions are pinned to a commit, not a tag that its owner (or someone who
# took over their account) could move to other code. The comment says which
# release it is; to update one, look up the new release's commit.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To create the release. The token is only handed to the last step:
      # install, tests and build run dependencies' code, which mustn't see it.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every tag, so the tests can check released changelog sections are unchanged.
          fetch-depth: 0
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      # Uses the pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

      - name: Package the build for self-hosting
        run: cd dist && zip -r "../boardcut-$GITHUB_REF_NAME.zip" .

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "boardcut-$GITHUB_REF_NAME.zip"
