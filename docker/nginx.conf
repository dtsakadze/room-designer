server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Don't tell the world which nginx version this is.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # Always check for a new version of the page itself.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ =404;
  }

  # File names in assets/ have content hashes, so they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Cloudflare's copy of the headers; nothing for anyone to read here.
  location = /_headers {
    return 404;
  }
}
